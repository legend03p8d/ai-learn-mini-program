register('A01',s=>`<div class="row-spread"><span class="small muted">好奇心，是学习的开始</span>${icon('spark')}</div><h1>今天想弄懂什么？</h1><p class="lead">一个问题，一份资料，一次新的理解。</p><div class="input-composer"><label class="sr-only" for="${s._key}-topic">学习主题</label><textarea id="${s._key}-topic" data-field="input" maxlength="20000" placeholder="例如：用通俗的方式，带我理解机器学习">${esc(s.input)}</textarea><div class="composer-foot"><span>主题 / 文字 / 学习目标</span><span data-counter>${s.input.length} / 20,000</span></div></div><div class="attach-grid"><button data-action="go" data-value="A03">${icon('file')}文档</button><button data-action="go" data-value="A04">${icon('video')}视频</button><button data-action="go" data-value="A05">${icon('link')}网页</button></div><div class="mode-line"><span>知识获取方式</span><button data-action="go" data-value="A07">${icon('globe','small-icon')}${modeName(s.mode)}${icon('down','small-icon')}</button></div>${error(s)}${btn(`${icon('spark','small-icon')} 整理学习内容`,'prepare','','primary full')}<div class="resume"><div class="resume-head"><span>上次的好奇，还可以继续</span>${icon('route','small-icon')}</div><strong>机器学习入门</strong><div class="resume-bottom"><span class="small muted">${s.quizStarted?score(s).submitted:2}/5 题已完成</span><button class="text-btn" data-action="resume">继续学习 ${icon('arrow','small-icon')}</button></div></div>${heading('从一个小问题开始')}<button class="idea" data-action="example">${icon('spark')} 机器学习是怎么“学会”的？</button><button class="idea" data-action="go" data-value="A02">${icon('file')} 把一段培训资料变成自测题</button>`,null,'home','统一入口；首次体验无需登录，支持恢复上次学习。');
function modeName(m){return {web:'全网获取',specific:'指定来源',own:'仅依据资料',mixed:'资料与全网补充'}[m]||'全网获取';}
register('A02',s=>`${title('把资料，读成自己的知识','粘贴正文，再告诉我们你想重点学什么。')}${textfield('资料正文','text',s.text,'资料文本最多 20,000 字；主题输入不受 200 字门槛限制。')}${field('学习目标（选填）','goal',s.goal)}${notice('仅依据资料出题时，不补充资料以外的事实。')}${error(s)}`,()=>btn('确认资料，整理知识','prepare-text'),null,'文字预览与学习目标；不足、超长输入均有说明。');
register('A03',s=>`${title('添加学习文档','让讲义、笔记和课件成为你的专属练习。')}<div class="dropzone">${icon('upload')}<strong>选择一份学习资料</strong><p>PDF / DOCX / PPTX / TXT / Markdown</p>${btn('使用示例讲义','add-sample','PDF','secondary')}<input type="file" class="file-input" data-file="document" aria-label="选择本地文档，仅演示文件信息" accept=".pdf,.docx,.pptx,.txt,.md,.markdown"></div><div class="small muted">单文档 ≤ 20 MB，≤ 200 页 / 张<br>TXT、Markdown ≤ 2 MB</div>${heading('本次资料')}${sources(s)}${notice('本地文件仅展示文件信息，不上传、不读取正文。继续演示使用示例讲义。')}${error(s)}`,()=>go('继续，选择获取方式','A07'),null,'支持全部文档类型；扫描件 OCR 的低置信度见异常画板。');
register('A04',s=>`${title('从视频里，提炼重点','上传视频，或添加公开的视频链接。')}${segments([['file','上传视频'],['url','视频链接']],s.settingsTab,'set','settingsTab')}${s.settingsTab==='file'?`<div class="dropzone">${icon('video')}<strong>把一节课变成一次练习</strong><p>视频 ≤ 500 MB，时长 ≤ 60 分钟</p>${btn('使用示例视频','add-sample','VIDEO','secondary')}<input class="file-input" type="file" accept="video/*" data-file="video" aria-label="选择视频，仅展示文件信息"></div>`:field('公开视频链接','videoUrl',s.videoUrl,'仅处理可公开读取的字幕；受限视频可替换为有权使用的文件。')}${heading('内容如何处理')}${steps([['读取可用字幕','优先保留视频中的原有表达'],['必要时转写音频','仅用于上传或已获授权的内容'],['保留时间位置','每个知识点都可以回到视频片段']],0)}${error(s)}`,s=>btn('添加视频资料','add-video'),null,'上传 / 链接切换；字幕、转写和时间点完整呈现。');
register('A05',s=>`${title('把网页，变成学习材料','添加公开可访问的网页，自动识别视频页面。')}${textfield('网页链接（每行一个）','url',s.url,'纯网页任务最多 10 个链接；混合资料任务最多 5 份来源。')}${btn(`${icon('plus','small-icon')} 添加链接`,'add-urls','','secondary full')}${error(s)}${heading('已添加的网页')}${s.sources.filter(x=>x.type==='WEB').map(x=>sourceRow(x)).join('')||notice('添加链接后会在这里显示。')}${notice('网页无法读取时，可以粘贴正文。示例演示不会访问或抓取你填写的网址。')}`,()=>go('查看组合资料','A06'),null,'URL 校验、计数限制；不伪装真实网页抓取。');
register('A06',s=>`${title('这次，想一起学哪些资料？','把相关资料放在一起，形成连贯的知识范围。')}<div class="row-spread"><span class="small muted">${s.sources.length} 份资料</span>${chip('组合上限 5 份','blue')}</div>${sources(s)}<div class="attach-grid"><button data-action="go" data-value="A03">${icon('plus')}文档</button><button data-action="go" data-value="A04">${icon('plus')}视频</button><button data-action="go" data-value="A05">${icon('plus')}网页</button></div>${field('补充学习目标','goal',s.goal)}${error(s)}${notice('一份资料处理失败，不会影响其他已成功读取的内容。')}`,()=>go('选择知识获取方式','A07'),null,'可移除单份来源；混合资料上限按人工确认执行。');
register('A07',s=>`${title('知识从哪里来？','选择本次学习的范围，答案也会遵守这个范围。')}<div class="choice-list">${[['web','globe','全网获取','围绕主题，整理公开网络上的可靠内容'],['specific','target','指定来源','只在你提供的网站或链接内获取知识'],['own','file','仅依据我的资料','不添加资料范围外的事实'],['mixed','layers','资料 + 全网补充','以资料为主，外部补充单独标记']].map(([v,i,t,d])=>`<button class="choice ${s.mode===v?'selected':''}" aria-pressed="${s.mode===v}" data-action="set" data-field-name="mode" data-value="${v}">${icon(i)}<span class="choice-copy"><strong>${t}</strong><small>${d}</small></span><span class="radio-dot"></span></button>`).join('')}</div>${notice('题目、讲解和总结，都能查看实际采用的来源。')}`,s=>btn(s.mode==='specific'?'设置指定来源':'确认，整理学习内容','confirm-mode'),null,'四种模式均完整展示；选择指定来源后补充范围。');
register('A08',s=>`${title('只从这些地方学习','添加网站范围或具体链接，让学习更加聚焦。')}${textfield('来源范围或链接','sourceScope',s.sourceScope,'示例：某个公开课程网站，或一组具体文章 URL。')}${notice('仅使用指定来源。读取失败时，不会自动改用全网内容。')}${notice('遇到登录、付费墙或访问限制时会明确提示，请替换资料或粘贴有权使用的正文。')}${error(s)}`,()=>btn('确认来源范围','confirm-scope'),null,'不静默扩展来源边界；访问受限的恢复见 F03。');
register('A09',s=>`<div class="load-orbit">${icon('layers')}</div>${title('正在整理你的学习内容','每份来源独立处理，成功的资料会为你保留。')}${steps([['已收到学习资料',`${s.sources.length} 份来源，分别检查可读取内容`],['提取正文与知识点','保留页码、段落和视频时间点'],['整理内容与核对来源','识别重复内容、冲突与低置信度'],['准备知识摘要','确认范围后再生成题目']],2)}${notice('可先离开，稍后返回继续。这里为阶段演示，不显示虚假完成百分比。')}<div class="button-row">${go('稍后回来','A01','')}${go('查看来源状态','A11','')}</div>`,()=>btn('查看整理结果','processed'),null,'阶段可见；演示通过按钮推进，不模拟真实任务进度。');
register('A10',s=>`${chip('知识已整理','green')}<div class="spacer"></div>${title('从 5 个知识点，\n理解机器学习','确认下面的学习范围，就可以准备闯关。')}${segments([['summary','知识摘要'],['sources','来源清单']],s.viewTab,'set','viewTab')}${s.viewTab==='sources'?sources(s):D.lessons.map((x,i)=>`<div class="knowledge"><span class="knowledge-num">0${i+1}</span><div><h3>${x}</h3><p>${['模型如何从样本中学习规律。','学习参数与使用模型预测的区别。','为什么训练高分不等于真正学会。','用独立数据检验学习效果。','理解测试集与交叉验证的作用。'][i]}</p>${chip(anchor(s,D.questions[[0,1,3,4,2][i]]).location,'blue')}</div></div>`).join('')}${notice('以上为机器学习示例知识。正式产品只会使用成功读取并经确认的来源。')}${error(s)}`,()=>btn('确认知识，设置闯关','confirm-knowledge'),null,'来源可删除并重新整理；未经确认不直接进入题组。');
register('A11',s=>`${title('每个结论，都有出处',`${s.sources.filter(x=>x.status==='accepted').length} 份已读取，${s.sources.filter(x=>x.status==='failed').length} 份需要处理。`)}${sources(s)}${notice('删除来源后需要重新整理知识，新的题组不会继续引用该来源。')}<div class="button-row">${go('追加资料','A06','')}${go('重新整理','A09','secondary')}</div>${s.removedSources.length?notice(`已移除 ${s.removedSources.length} 份来源；等待重新整理。`):''}`,()=>go('回到知识摘要','A10'),null,'已采用和失败来源同时可见；独立重试、移除、追加。');
register('A12',s=>`${title('回到知识的原处',esc((s.sources.find(x=>x.id===s.activeSource)||D.sources.find(x=>x.type===({file:'PDF',web:'WEB',video:'VIDEO'}[s.settingsTab])))?.name||'学习资料')+' · 原型示例资料')}${segments([['file','文档'],['web','网页'],['video','视频']],s.settingsTab,'set','settingsTab')}<div class="row-spread">${chip(s.settingsTab==='video'?'02:16 — 02:48':s.settingsTab==='web'?'第 3 段':'第 8 / 12 页','blue')}${chip('定位依据')}</div><div class="spacer"></div><article class="article-copy"><h3>如何检验模型的学习效果</h3><p>模型是否能解决实际问题，需要通过没有参与训练的数据进行检验。</p><div class="citation">${D.questions[2].quote}</div><p>训练集中的准确率可以帮助观察学习过程，但不能代替对新数据上泛化表现的评估。</p></article>${notice(s.settingsTab==='video'?'展示字幕时间段；真实播放器将在产品接入时提供。':s.settingsTab==='web'?'这是本地网页内容示例，没有伪造外部链接。':'原文高亮与页码让讲解依据可以追溯。')}`,()=>go('返回来源清单','A11','secondary'),null,'文档页码、网页段落、视频时间点可切换预览。');

register('B01',s=>`${chip('来源范围已确认','green')}<div class="spacer"></div>${title('为这次好奇，选一个节奏','机器学习入门 · 5 个核心知识点')}${heading('本次题量')}${pills([[5,'5 题'],[10,'10 题'],['custom','自定义']],s.count,'count')}${s.count==='custom'?field('自定义题量（3–10）','customCount',s.customCount||5,'number'):''}${heading('题型组合')}${pills([['mixed','混合题型'],['single','单选'],['multiple','多选'],['boolean','判断']],s.qtype,'qtype')}${heading('学习难度')}${pills([['mixed','由浅入深'],['basic','基础理解'],['advanced','进阶应用']],s.difficulty,'difficulty')}${notice('多选题需要选中全部正确项且无错选才得分。提交前可以修改答案。')}<p class="small muted">每题提交后立即查看讲解；按照自己的节奏学习，没有倒计时。</p>${error(s)}`,()=>btn('生成我的闯关','generate'),null,'设置实际影响演示题组的题量和题型；样例题库上限会明确提示。');
register('B02',s=>`<div class="load-orbit">${icon('spark')}</div>${title('把知识，变成好问题','我们也在检查答案与来源是否一致。')}${steps([['正在整理资料','保留已经确认的学习范围'],['正在提取知识点与证据','将知识点与原文位置关联'],['正在生成候选题','覆盖你的学习重点'],['正在检查答案和来源','检查题型、歧义与依据'],['正在准备闯关','讲解将随题目一起准备好']],3)}<p class="small muted">演示以阶段推进；实际耗时取决于资料内容。</p>`,()=>go('查看准备好的闯关','B03'),null,'五阶段生成；讲解预先准备，答案提交后无需等待。');
register('B03',s=>`<div class="load-orbit">${icon('route')}</div>${title('准备好，往前一步','机器学习入门')}${metric([s.qids.length,'道问题'],[new Set(s.qids.map(i=>D.questions[i].type)).size,'种题型'],[Math.ceil(s.qids.length*.8),'预计分钟'])}${heading('这一局，你会学到')}<div class="concept-flow">${['模型与数据','训练与推理','泛化与评估'].map(t=>`<span>${t}</span>`).join(icon('arrow'))}</div>${notice('可以反复练习；每次挑战都会保留独立作答记录。')}<button class="text-btn" data-action="regenerate">${icon('refresh','small-icon')} 重新准备这组题</button>`,()=>btn('开始闯关','start'),null,'开局前预览并可重新生成；点击开始进入连续作答。');
function quizView(s){const q=D.questions[s.qids[s.qi]],a=s.answers[s.qi],submitted=Array.isArray(a);const right=submitted&&correct(a,q);const missed=submitted?q.correct.filter(x=>!a.includes(x)):[];const wrong=submitted?a.filter(x=>!q.correct.includes(x)):[];return `<div class="quiz-progress" aria-label="第 ${s.qi+1} 题，共 ${s.qids.length} 题">${s.qids.map((_,i)=>`<span class="${i<=s.qi?'done':''}"></span>`).join('')}</div><div class="quiz-meta">${chip(typeName(q.type),'blue')}<span class="quiz-counter">${s.qi+1} / ${s.qids.length}　${submitted?'已提交':'思考一下'}</span></div><span class="small muted">${q.tag} · ${q.type==='multiple'?'可选择多项':'请选择一项'}</span><h2 class="question-stem">${q.stem}</h2><div class="options">${q.options.map((o,i)=>{let cls=(submitted?a:s.selection).includes(i)?'selected':'';let text='';if(submitted){if(q.correct.includes(i)&&a.includes(i)){cls='correct';text='✓ 选对';}else if(missed.includes(i)){cls='missed';text='! 漏选';}else if(wrong.includes(i)){cls='wrong';text='× 错选';}}return `<button class="option ${q.type==='multiple'?'multi':''} ${cls}" ${submitted?'disabled':''} data-action="option" data-value="${i}" aria-pressed="${(submitted?a:s.selection).includes(i)}"><span class="option-key">${String.fromCharCode(65+i)}</span><span class="option-label">${o}${text?`<span class="answer-status">${text}</span>`:''}</span></button>`;}).join('')}</div>${submitted?`<div class="feedback ${right?'':'error'}"><h3>${icon(right?'check':'info')}${right?'回答正确，理解更进一步':missed.length&&wrong.length?'有漏选，也有错选':missed.length?'还差一点，漏选了正确项':'这次答错了，一起弄懂它'}</h3><p>你的答案：${a.map(i=>String.fromCharCode(65+i)).join('、')}　正确答案：${q.correct.map(i=>String.fromCharCode(65+i)).join('、')}</p></div><section class="explanation"><div class="row-spread"><h3>为什么这样选？</h3>${chip('AI 生成讲解')}</div><p>${q.why}</p><p class="muted">${q.wrong}</p>${citation(q,s)}${linkbtn('题目或讲解有误','E09')}</section>`:`<p class="small muted">${q.type==='multiple'?'多选题：全部选对且无错选才得分。':'确认后提交，即可查看讲解。'}</p>`}${error(s)}`;}
function quizFooter(s){const a=s.answers[s.qi];return Array.isArray(a)?btn(s.qi===s.qids.length-1?'完成，查看学习报告':'下一题','next'): `<p class="helper muted">${s.selection.length?`已选择 ${s.selection.length} 项`:'请选择你的答案'}</p>${btn('提交答案','submit','','primary',s.selection.length?'':'disabled')}`;}
['B04','B05','B06','B07','B08'].forEach(id=>register(id,quizView,quizFooter,null,'提交前可改选；提交后锁定首次作答，正误与来源即时展开。'));
register('B09',s=>`<div class="modal-preview"><div class="confirm-box"><span class="checkmark-circle">${icon('check')}</span><h2>进度已经为你保留</h2><p>你已完成 ${score(s).submitted} / ${s.qids.length} 题。可以稍后继续，也可以提前结束，查看这部分的复盘。</p>${btn('继续答题','resume','','primary full')}<div class="spacer"></div>${go('保存并返回首页','A01','full')}<div class="center">${btn('提前结束，生成未完成报告','early-end','','text-btn')}</div></div></div>`,null,null,'保存退出和提前结束明确区分，不把未完成任务标成通关。');

register('C01',s=>{const x=score(s);return `<div class="report-hero"><div class="award">${icon('award')}</div><h2>又弄懂了一些新知识</h2><p>机器学习入门 · 本次学习已完成</p><div class="score">${x.accuracy}<small>/ 100 分</small></div><p>认真思考的每一步，都算数。</p></div>${reportMetrics(s)}${segments([['summary','知识总结'],['review','逐题复盘'],['sources','来源']],s.viewTab,'report-tab')}${heading('把知识串起来') }<div class="concept-flow"><span>数据</span>${icon('arrow')}<span>训练</span>${icon('arrow')}<span>评估</span></div><p class="small muted">从样本中学习规律，再用独立数据检验。训练效果好，不等于对新数据也准确。</p>${row('查看完整知识总结','5 个知识点与相互关系','book','C02')}${x.right<x.submitted?row('下一步，复习没掌握的部分',`${x.submitted-x.right} 道错题 · 从解释回到依据`,'target','C05'):notice('本次全部答对。可以重新挑战，巩固理解。','success')}${notice('本次正确率只反映这组题的首次作答表现。')}`;},()=>`<div class="button-row">${go('复习与挑战','C05')}${go('分享预览','C07','')}</div>`,null,'分数由实际首次作答计算；统计与逐题记录相互对应。');
register('C02',s=>`${title('把零散知识，连成理解','机器学习入门 · AI 生成总结') }<div class="concept-flow"><span>准备数据</span>${icon('arrow')}<span>训练模型</span>${icon('arrow')}<span>独立评估</span></div>${D.lessons.map((x,i)=>`<div class="knowledge"><span class="knowledge-num">0${i+1}</span><div><h3>${x}</h3><p>${['模型从已有样本中学习规律，再用于处理新样本。','训练用于学习参数，推理用这些参数产生预测。','如果只记住训练细节，新数据上的表现可能变差。','将测试集与训练分离，有助于得到更客观的检验。','使用独立测试集或交叉验证评估泛化表现。'][i]}</p>${citation(D.questions[[0,1,3,4,2][i]],s)}</div></div>`).join('')}`,()=>go('查看逐题复盘','C03'),null,'结构化总结与知识关系，知识点可回溯来源。');
register('C03',s=>`${title('回看每一次思考','保留你的首次答案；再次练习会创建新记录。')}${score(s).rows.map(({a,i,q})=>`<details ${i===2?'open':''}><summary>第 ${i+1} 题 · ${q.tag} ${chip(correct(a,q)?'正确':'错误',correct(a,q)?'green':'red')}</summary><p><strong>${q.stem}</strong></p><p>你的答案：${a.map(j=>String.fromCharCode(65+j)).join('、')}<br>正确答案：${q.correct.map(j=>String.fromCharCode(65+j)).join('、')}</p><p>${q.why}</p><div class="citation">${q.quote}<small>${esc(anchor(s,q).name)} · ${anchor(s,q).location}</small></div></details>`).join('')||notice('尚未提交答案。先开始一局学习。')}${s.invalid.length?notice(`${s.invalid.length} 道已确认无效题已从统计分母排除。`):''}${linkbtn('题目有误，提交反馈','E09')}`,()=>go('返回本次报告','C01','secondary'),null,'首次答案、正确答案和依据齐全；无效题带更正说明。');
register('C04',s=>`${title('这份报告依据了什么？','仅列出本次实际采用的来源。')}${s.sources.filter(x=>x.status==='accepted').map(x=>sourceRow(x,false)).join('')}${notice(`知识获取范围：${modeName(s.mode)}。外部补充内容在来源旁单独标记。`)}${heading('来源使用说明')}<p class="small muted">原始资料默认仅自己可见。分享报告不会同步公开文档、视频或完整网页内容。</p>`,()=>go('返回本次报告','C01','secondary'),null,'公开来源与用户资料明确区分，保留定位与隐私边界。');
register('C05',s=>{const x=score(s),wrong=x.rows.filter(z=>!correct(z.a,z.q));return `${title('再想一次，会更清楚','把暂时没掌握的部分，变成下一次的收获。')}<div class="bluebox"><div class="row-spread"><h3>针对性复习</h3>${chip(`${wrong.length} 道错题`,'blue')}</div><p class="small muted">${wrong.length?'只复习本局答错的题目，保留原来的成绩。':'本局没有错题，可以再挑战一次完整题组。'}</p>${btn('开始错题复习','review-wrong','','primary full',wrong.length?'':'disabled')}</div>${wrong.map(z=>row(z.q.tag,typeName(z.q.type),'target','C03')).join('')}${heading('也可以重新出发')}<p class="small muted">重新挑战整组题，记录一次新的学习结果。</p>${btn('重新挑战整组题','restart','','secondary full')}<div class="center">${go('学习一个新主题','A01','text-btn')}</div>`;},null,null,'复习与重新挑战均新建作答，不覆盖之前的首次结果。');
register('C06',s=>`${chip('未完成报告','amber')}<div class="spacer"></div>${title('先把已经学到的留下','本次学习提前结束；尚未作答的题不计入正确率。')}${reportMetrics(s)}${heading('已完成的部分')}${score(s).rows.map(z=>row(z.q.tag,`${typeName(z.q.type)} · ${correct(z.a,z.q)?'回答正确':'需要复习'}`,'check','C03')).join('')}${notice('这是一份未完成报告，不能视为完整通关。')}`,()=>go('查看已答题复盘','C03'),null,'正确率以已提交有效题为分母，完成度另行展示。');
function shareCard(s){const x=score(s),r=s.shareTarget==='D11';const t=totals(s,true);return `<div class="share-card"><div class="share-brand">${icon('layers','small-icon')} AI 闯关学习</div><h2>${r?'这一周，理解多一点':'机器学习入门'}</h2><p>${r?'我整理了一份阶段学习报告。':'我完成了一次关于机器学习的知识闯关。'}</p>${s.shareScore?`<div class="share-score">${r?t.rate:x.accuracy}% <span class="small">正确率</span></div>`:''}${s.shareSummary?'<p>从数据中学习，用独立数据检验。<br>让理解停留得更久一点。</p>':''}${s.shareName?'<p>学习者 小知 的学习记录</p>':''}<div class="share-bottom"><span>AI 生成摘要<br>仅展示已授权内容</span><span class="share-symbol">${icon('book')}</span></div></div>`;}
register('C07',s=>`${title('分享收获，由你决定范围','先预览，再选择希望公开的内容。')}${shareCard(s)}${switchrow('昵称与头像','shareName',s.shareName)}${switchrow('答题得分 / 正确率','shareScore',s.shareScore)}${switchrow('部分知识总结','shareSummary',s.shareSummary)}<label class="field"><span>分享有效期</span><select data-field="shareExpiry"><option value="7" ${s.shareExpiry==='7'?'selected':''}>7 天</option><option value="1" ${s.shareExpiry==='1'?'selected':''}>1 天</option><option value="30" ${s.shareExpiry==='30'?'selected':''}>30 天</option></select></label>${notice('原文件、完整错题和个人学习中心不会随分享公开。')}`,()=>btn('生成分享预览','share'),null,'隐私开关实时更新卡片；网页只演示分享，不实际发送。');
register('C08',s=>`${chip('好友分享的学习摘要','blue')}${shareCard(s)}${notice('你只能查看分享者授权的摘要，无法访问原始资料或个人学习记录。')}${heading('把你的好奇，也变成收获')}<p class="small muted">输入一个想了解的主题，或者从自己的学习资料开始。</p>`,()=>go('开启我的学习','A01'),null,'接收方页面只消费授权字段；无原文件和个人中心入口。');
register('C09',s=>`${title('我分享过的学习收获','管理可见范围，随时收回访问权限。')}${s.shareActive?`<div class="softbox"><div class="row-spread"><h3>机器学习入门</h3>${chip('分享中','green')}</div><p class="small muted">有效期 ${s.shareExpiry} 天 · 仅授权摘要</p><div class="button-row">${go('查看摘要','C08','')}${btn('撤回分享','revoke','','danger')}</div></div>`:emptyState('暂无有效分享','已撤回的内容将无法继续访问。','share','',go('生成分享预览','C07','secondary'))}${notice('撤回仅改变摘要的访问权限，不会删除你的学习报告。')}`,null,null,'分享可撤回；接收方重新打开时显示失效状态。');

// Remaining screen renderers and interaction controller are below.
window.__prototypeBuild={D,views,register};

function centerTabs(active){return segments([['D01','概览'],['D03','记录'],['D07','错题'],['D09','报告']],active,'go');}
function historyRows(s){const rr=records(s);return rr.map(r=>`<div class="record-date">${r.date} · ${r.complete?'已完成':'未完成'}</div><button class="list-row" data-action="record" data-value="${r.id}"><span class="row-badge">${icon(r.complete?'book':'clock')}</span><span class="row-main">${esc(r.title)}<small>${r.answers.length} 道题 · 仅依据资料</small></span><span class="${r.complete?'blue':'muted'}">${r.answers.length?Math.round(r.answers.filter(Boolean).length/r.answers.length*100):0}%</span></button>`).join('')||emptyState('没有匹配的学习记录','调整时间、主题或完成状态后再试。','book');}
function trend(s){const t=totals(s);const dates=[...new Set(t.answers.map(a=>a.date))].sort();if(dates.length<2)return notice('暂无足够数据。至少两个学习日期后再查看趋势。');const values=dates.map(date=>{const a=t.answers.filter(x=>x.date===date);return Math.round(a.filter(x=>x.v).length/a.length*100);});const xs=values.map((_,i)=>38+i*(235/(values.length-1))),ys=values.map(v=>132-v*.96);return `<svg class="chart" viewBox="0 0 310 160" role="img" aria-label="${dates.map((d,i)=>`${d} 正确率 ${values[i]}%`).join('，')}">${[0,50,100].map(v=>`<line x1="35" y1="${132-v*.96}" x2="285" y2="${132-v*.96}"/><text x="2" y="${136-v*.96}">${v}%</text>`).join('')}<polyline points="${xs.map((x,i)=>`${x},${ys[i]}`).join(' ')}" fill="none" stroke="#3258da" stroke-width="2.5"/>${xs.map((x,i)=>`<circle cx="${x}" cy="${ys[i]}" r="4" fill="#3258da"/><text x="${x}" y="${ys[i]-10}" text-anchor="middle">${values[i]}%</text><text x="${x}" y="153" text-anchor="middle">${dates[i].slice(5).replace('-','/')}</text>`).join('')}</svg>`;}
function filterSelect(label,name,opts,value){return `<select data-field="${name}" aria-label="${label}">${opts.map(([v,t])=>`<option value="${v}" ${value===v?'selected':''}>${t}</option>`).join('')}</select>`;}
register('D01',s=>{const t=totals(s);return `${title('看见每一点进步','把学过的知识，慢慢变成自己的。')}${centerTabs('D01')}<div class="filter-row">${filterSelect('时间范围','period',[['week','最近 7 天'],['today','今天'],['month','最近 30 天']],s.period)}${filterSelect('主题','topicFilter',[['all','全部主题'],['机器学习','机器学习'],['沟通表达','沟通表达']],s.topicFilter)}${linkbtn('更多筛选','D02')}</div><div class="mini-stats"><div class="mini-stat"><strong>${t.complete}<span class="small"> 次</span></strong><small>完成学习</small></div><div class="mini-stat"><strong>${t.rate}<span class="small"> %</span></strong><small>首次作答正确率</small></div></div><div class="row-spread small muted"><span>${t.records.length} 次学习 · ${t.total} 题</span><span>学习活跃 ${t.days} 天</span></div>${heading('让进步有迹可循',linkbtn('统计口径','D12'))}${trend(s)}${heading('下一步，从这里开始')}${row('查看题型与知识点表现','单选、多选、判断与知识点分析','chart','D05')}${row('继续未完成的学习','机器学习入门 · 还剩 3 题','clock','B09')}${row('复习薄弱知识点',`${t.answers.filter(x=>!x.v).length} 道错题等待巩固`,'target','D07')}`;},()=>go('生成阶段学习报告','D10'),'center','指标从统一记录计算；筛选和无数据状态真实联动。');
register('D02',s=>`${title('找到你关心的学习','筛选记录、题型与知识点，查看对应表现。')}<label class="field"><span>时间范围</span>${filterSelect('时间范围','period',[['week','最近 7 天'],['today','今天'],['month','最近 30 天']],s.period)}</label><label class="field"><span>学习主题</span>${filterSelect('学习主题','topicFilter',[['all','全部主题'],['机器学习','机器学习'],['沟通表达','沟通表达']],s.topicFilter)}</label><label class="field"><span>知识点</span>${filterSelect('知识点','knowledgeFilter',[['all','全部知识点'],...['模型与数据','训练与推理','模型评估','过拟合','数据划分'].map(v=>[v,v])],s.knowledgeFilter)}</label><label class="field"><span>题型</span>${filterSelect('题型','typeFilter',[['all','全部题型'],['single','单选'],['multiple','多选'],['boolean','判断']],s.typeFilter)}</label>${heading('完成状态')}${pills([['all','全部'],['complete','已完成'],['incomplete','未完成']],s.statusFilter,'statusFilter')}<div class="center">${btn('重置筛选','reset-filters','','text-btn')}</div>`,()=>go('应用筛选，查看概览','D01'),null,'五个维度一起作用于统计；没有记录时不推断趋势。');
register('D03',s=>`${title('学过的，都在这里','每次挑战都有独立的记录。')}${centerTabs('D03')}${field('搜索学习主题','search',s.search)}${historyRows(s)}`,null,'center','搜索与记录打开可用；不覆盖历史首次作答。');
register('D04',s=>{const r=s.history.find(x=>x.id===s.selectedRecord)||s.history[0];if(!r)return emptyState('这条记录已删除','返回学习中心查看其他记录。','book','',go('返回学习中心','D01'));return `${chip(r.complete?'已完成':'未完成',r.complete?'green':'amber')}<div class="spacer"></div>${title(esc(r.title),`${r.date} · 仅依据用户资料`)}${metric([r.answers.length,'已答题量'],[`${r.answers.length?Math.round(r.answers.filter(Boolean).length/r.answers.length*100):0}%`,'正确率'],[r.answers.filter(x=>!x).length,'错题'])}${row('作答明细','查看本次首次答案与讲解','book','C03')}${row('本次学习报告','知识总结、薄弱点与复习建议','chart','C01')}${row('原始来源','查看来源版本与内容定位','file','C04')}${heading('报告版本')}<div class="softbox"><h3>版本 1 · 首次生成</h3><p class="small muted">${r.date} · 成绩与作答记录一致</p>${chip('当前查看','blue')}</div>${btn('删除这次学习记录','delete-start','record','danger full')}`;},null,null,'可打开明细和报告；删除前展示关联数据与分享影响。');
register('D05',s=>{const t=totals(s);return `${title('换个角度，看答题表现','按单选、多选和判断题查看正确率与题量。')}${metric([t.total,'已答题量'],[t.right,'正确题量'],[`${t.rate}%`,'总体正确率'])}${['single','multiple','boolean'].map(type=>{const a=t.answers.filter(x=>x.type===type),n=a.filter(x=>x.v).length,p=a.length?Math.round(n/a.length*100):0;return `<div class="bar-row"><div class="bar-label"><span>${typeName(type)}</span><strong>${a.length?`${p}%`:'暂无数据'}</strong></div>${progress(p)}<small>${n} / ${a.length} 题正确</small></div>`;}).join('')}${notice('多选题按全对且无错选计分。各题型表现以首次作答为准。')}${row('查看相关错题','从具体题目找到可改进的地方','target','D07')}`;},()=>go('查看知识点表现','D06','secondary'),null,'三种题型分布来自相同有效作答数据。');
register('D06',s=>{const t=totals(s);return `${title('哪些已理解，哪些再想想','有效题量达到 3 题后，才标记需要巩固的知识点。')}${filterSelect('主题','topicFilter',[['all','全部主题'],['机器学习','机器学习'],['沟通表达','沟通表达']],s.topicFilter)}${['模型与数据','训练与推理','模型评估','过拟合','数据划分'].map(tag=>{const a=t.answers.filter(x=>x.tag===tag),n=a.filter(x=>x.v).length,p=a.length?Math.round(n/a.length*100):0;return `<div class="bar-row"><div class="bar-label"><span>${tag}</span>${chip(a.length<3?'数据不足':p<60?'待巩固':'表现稳定',a.length<3?'':p<60?'amber':'green')}</div>${progress(p)}<small>${n} / ${a.length} 题正确${a.length?` · ${p}%`:''}</small></div>`;}).join('')}${notice('原型示例口径：至少 3 道有效作答且正确率低于 60% 标记待巩固，不等同于能力诊断。')}`;},()=>go('针对薄弱点复习','D07'),null,'说明题量门槛，避免把小样本成绩等同于掌握程度。');
register('D07',s=>{const t=totals(s),wrong=t.answers.filter(a=>!a.v);return `${title('错过的，再想明白','每一次回看，都是新的理解。')}${centerTabs('D07')}<div class="row-spread"><span class="small muted">共 ${wrong.length} 道待复习</span>${linkbtn('知识点分析','D06')}</div>${wrong.slice(0,5).map((a,i)=>`<button class="list-row" data-action="go" data-value="D08"><span class="row-badge">${icon('target')}</span><span class="row-main">${a.tag}<small>${a.date} · ${typeName(a.type)} · 首次答错</small></span>${icon('arrow','small-icon')}</button>`).join('')||emptyState('暂时没有错题','继续保持，也可以重新挑战巩固理解。','check')}${wrong.length>5?`<p class="small muted">另有 ${wrong.length-5} 道相同知识点错题，合并到针对性练习。</p>`:''}${notice('复习成绩单独保存，原始错误记录仍可查看。')}`;},()=>btn('开始针对性复习','center-review'),'center','错题从统一历史记录筛出；复习另建记录。');
register('D08',s=>`${chip('模型评估 · 多选题','amber')}<div class="spacer"></div>${title('再看这道题')}<p class="question-stem">${D.questions[2].stem}</p><div class="softbox"><p>首次答案：A<br>正确答案：A、C</p><span class="small red">漏选 C：进行交叉验证</span></div><p>${D.questions[2].why}</p>${citation(D.questions[2],s)}${heading('复习后，有什么变化？')}${s.reviewFinished?notice('本次复习结果已保存。样本仍不足，不给出长期改善结论。','success'):notice('尚无足够复习记录。完成一次复习后，可回看新的作答结果。')}`,()=>btn('现在再答一次','center-review'),null,'首次错题与复习结果并存；不凭单题宣称长期改善。');
register('D09',s=>`${title('给学习，留一份回顾','周报、月报和你定义的每一个阶段。')}${centerTabs('D09')}${s.reports.length?s.reports.map(r=>`<button class="list-row" data-action="open-report" data-value="${r.id}"><span class="row-badge">${icon('chart')}</span><span class="row-main">${esc(r.name)}<small>${esc(r.range)} · ${esc(r.generated)}</small></span>${icon('arrow','small-icon')}</button>`).join(''):emptyState('还没有阶段报告','选择时间与主题，整理这一段学习。','chart')}${notice('重新生成会创建新版本，不会静默覆盖已经保存的报告。')}`,()=>go('生成新的阶段报告','D10'),'center','已有与新生成报告并存，可查看、分享和删除。');
register('D10',s=>`${title('回顾哪一段学习？','选好时间和主题，整理你的收获与下一步。')}${heading('报告类型')}${pills([['week','周报'],['month','月报'],['custom','自定义']],s.reportPeriod,'reportPeriod')}${field('开始日期','from',s.from,'date')}${field('结束日期','to',s.to,'date')}<label class="field"><span>主题范围</span>${filterSelect('报告主题','reportTopic',[['all','全部主题'],['机器学习','机器学习'],['沟通表达','沟通表达']],s.reportTopic)}</label>${notice('只统计选定范围内的有效作答。数据不足时会明确说明，不生成虚假趋势。')}${error(s)}`,()=>btn('生成阶段报告','create-report'),null,'支持周、月与自定义范围，日期校验和无数据处理可用。');
register('D11',s=>{const t=totals(s,true);return `${chip('AI 生成阶段报告','blue')}<div class="spacer"></div>${title(s.reportPeriod==='month'?'本月学习回顾':s.reportPeriod==='custom'?'这一阶段，学到了什么':'这一周，理解多一点',`${s.from} — ${s.to}`)}${metric([t.complete,'完成学习'],[t.total,'有效作答'],[`${t.rate}%`,'正确率'])}${t.total?`${heading('你的学习足迹')}<p>围绕机器学习，完成 ${t.complete} 次学习与 ${t.total} 道有效作答；其中 ${t.right} 道首次回答正确。</p>${heading('下一步建议')}<div class="bluebox"><h3>${t.right<t.total?'再理解一次模型评估':'继续用新问题检验理解'}</h3><p class="small muted">${t.right<t.total?'从错题回到讲义第 8 页，区分训练表现和对新数据的泛化表现。':'本期示例中的表现稳定，可通过重新挑战巩固。'}</p>${go('查看对应错题','D07','secondary full')}</div>`:emptyState('这个范围还没有学习记录','换个时间范围，或开始你的第一次学习。','chart')}${notice('复习改善需要足够的前后作答数据；当前不生成长期改善结论。')}${linkbtn('查看指标口径与原始记录','D12')}<div class="button-row">${go('重新生成','D10','')}${btn('删除报告','delete-start','report','danger')}</div>`;},()=>btn('分享报告摘要','share-report'),null,'基于所选记录生成；重新生成追加版本，指标可追溯。');
register('D12',s=>{const t=totals(s);return `${title('每个数字，都能找到依据','统计只使用未删除、有效的首次作答。')}<details open><summary>正确率如何计算？</summary><p>答对的有效题目数 ÷ 已提交的有效题目数。</p><div class="bluebox"><h3>${t.right} ÷ ${t.total} = ${t.rate}%</h3><p class="small muted">无效题、删除的记录和未提交题目不进入分母。</p></div></details><details><summary>完成次数和活跃天数</summary><p>完成次数：已完成全部有效题并产生通关报告的学习记录。<br>活跃天数：所选范围内有学习活动的不同日期数量。</p></details><details><summary>怎样判断薄弱知识点？</summary><p>原型使用至少 3 道有效作答、正确率低于 60% 的示例口径；正式产品可配置。</p></details>${heading('查看构成这些指标的记录')}${historyRows(s)}`;},null,null,'指标定义清晰，汇总可以回到原始学习记录。');

register('E01',s=>`<div class="profile"><div class="avatar">${s.logged?'知':icon('user')}</div><div><h2>${s.logged?'学习者 小知':'每一点好奇，都值得保存'}</h2><p>${s.logged?'学习记录已保存在演示账户':'游客模式 · 当前学习保存在本机'}</p></div></div>${!s.logged?go('登录，保存学习记录','E02','primary full'):notice('演示账户已登录，未调用微信授权服务。','success')}${heading('学习与账户')}${row('我的学习记录','回看每一次收获','book','D03')}${row('数据同步','查看同步与恢复状态','cloud','E04')}${row('分享管理','管理摘要可见范围','share','C09')}${heading('安心学习')}${row('个人数据管理','查看、导出或删除你的数据','shield','E06')}${row('隐私与 AI 内容说明','了解资料如何被使用','lock','E05')}${row('问题与反馈','查看反馈处理进度','chat','E09')}<p class="version">AI 闯关学习 · 成人学习场景</p>`,null,'me','游客入口、同步、分享授权与隐私设置集中管理。');
register('E02',s=>`${emptyState('让学过的知识，留下来','登录后保存历史、跨设备查看，并生成长期学习报告。','cloud')}<div class="softbox"><div class="row-spread"><span class="small">保存当前学习进度</span>${icon('check','small-icon')}</div><div class="spacer"></div><div class="row-spread"><span class="small">保留原来的游客记录</span>${icon('check','small-icon')}</div></div><label class="checkline"><input type="checkbox" data-field="agreed" ${s.agreed?'checked':''}><span>我已阅读并同意 <a href="#" data-action="go" data-value="E05">用户协议与隐私说明</a>，知悉 AI 内容仅用于学习。</span></label>${error(s)}${btn('微信授权登录（演示）','login','','primary full')}<div class="center">${go('继续以游客身份学习','A01','text-btn')}</div><p class="terms">这是原型中的授权状态演示，不会读取你的微信资料，也不会创建真实账户。</p>`,null,null,'不强制阻塞首次学习；未勾选协议时说明原因。');
register('E03',s=>`${emptyState('把这份进度，一起带过来','发现当前设备有一份游客学习记录，可以合并到演示账户。','layers')}<div class="softbox"><h3>机器学习入门</h3><p class="small muted">${score(s).submitted||2} 道已答 · 本机临时保存</p></div>${switchrow('合并当前设备的学习记录','merge',s.merge,'合并不会覆盖账户中的历史记录，也不会重复导入。')}${s.merged?notice('这份记录已经合并，不会重复导入。','success'):''}`,()=>btn('确认并进入学习中心','merge'),null,'合并可选且去重；保持既有记录完整。');
register('E04',s=>`${emptyState(s.syncDone?'记录已同步':s.logged?'登录已失效，进度仍在':'尚未登录',s.syncDone?'当前设备的示例记录已完成同步。':'你的当前题目、首次答案和学习报告仍保存在本机。','cloud',s.syncDone?'':'warning')}${steps([['本机学习进度','已保留，无需重新作答'],['账户登录状态',s.syncDone?'已恢复':'需要重新确认授权'],['跨设备同步',s.syncDone?'已完成':'恢复登录后继续同步']],s.syncDone?3:1)}${notice('同步只演示本地状态，不会发送任何真实学习资料。')}`,s=>s.syncDone?go('返回我的','E01','secondary'):btn('恢复登录并同步','restore-login'),null,'登录失效不丢题目；恢复后续传状态。');
register('E05',s=>`${title('关于资料与 AI 内容','这里把你需要知道的事说清楚。')}${segments([['privacy','隐私说明'],['terms','用户协议'],['ai','AI 说明']],s.policyTab||'privacy','set','policyTab')}${(s.policyTab||'privacy')==='privacy'?`<h3>资料与学习记录由你掌控</h3><ul class="privacy-list"><li>本原型只在浏览器保存演示状态；不会上传选择的文件。</li><li>真实产品中的私有资料默认仅本人可见，默认不用于模型训练。</li><li>分享仅包含主动授权的摘要，原始文件和完整错题不会自动公开。</li><li>你可以删除记录、撤回分享或申请删除账户数据。</li></ul>`:s.policyTab==='terms'?`<h3>面向成年人的学习工具</h3><p class="terms">请使用你有权使用的资料。学习内容不是考试认证或专业建议。页面展示的是待产品上线前完善的协议结构示例，不是完整法律文本。</p>`:`<h3>AI 帮助整理，也可能出错</h3><p class="terms">题目、讲解与总结会明确标识 AI 生成，并保留来源依据。你可以随时反馈答案、讲解或来源问题。</p><div class="softbox"><h3>模型与服务信息</h3><p class="small muted">原型未接入模型。正式服务名称及适用公示信息在上线前核实填写。</p></div>`}${row('管理我的数据','导出与删除入口','shield','E06')}`,null,null,'AI 公示占位明确，不编造备案、正式协议或真实服务。');
register('E06',s=>`${title('你的学习数据，你来管理','查看保存内容，以及每一次删除的影响。')}${metric([s.history.length,'学习记录'],[s.reports.length,'阶段报告'],[s.shareActive?1:0,'有效分享'])}${row('导出学习记录','生成本地演示数据文件','download','E08')}${row('管理分享授权','查看有效分享，或撤回访问','share','C09')}${heading('按需清理')}<div class="choice-list">${[['record','删除单次学习记录','同时更新相关统计和分享状态'],['source','删除当前来源资料','对应学习任务及派生数据一并清理'],['report','删除单份阶段报告','保留原始作答记录'],['account','删除全部演示账户数据','清除记录、报告与分享授权']].map(([v,t,d])=>`<button class="choice" data-action="delete-start" data-value="${v}">${icon('trash')}<span class="choice-copy"><strong>${t}</strong><small>${d}</small></span>${icon('arrow','small-icon')}</button>`).join('')}</div>`,null,null,'仅操作原型演示数据；删除联动统计和分享权限。');
register('E07',s=>{const names={record:'删除这次学习记录？',source:'删除来源与关联学习？',report:'删除这份阶段报告？',account:'删除全部演示账户数据？'};return `<div class="modal-preview"><div class="confirm-box"><div class="empty-icon error">${icon('trash')}</div><h2>${names[s.deleteType]}</h2><p>${{record:'关联作答将被移除，统计随之更新，相关分享失效。',source:'为避免报告继续引用已删除资料，当前来源对应的演示学习任务、作答和报告将一并清理。',report:'只删除选中的阶段报告，原始学习记录继续保留。相关分享失效。',account:'将清除本原型的学习记录、阶段报告和分享状态，不涉及你的真实账户。'}[s.deleteType]}</p><label class="checkline"><input type="checkbox" data-field="deleteConfirm" ${s.deleteConfirm?'checked':''}><span>我已了解本次删除的影响。</span></label>${error(s)}${btn('确认删除演示数据','delete-confirm','','danger full')}<div class="spacer"></div>${go('取消，保留数据','E06','full')}</div></div>`;},null,null,'先确认影响，再操作演示数据；不会删除用户文件或账户。');
register('E08',s=>`${emptyState(s.exportDone?'导出文件已准备好':'带走你的学习记录',s.exportDone?'浏览器将下载一份 JSON 文件。文件只包含原型中的演示记录。':'导出内容包括学习主题、首次答题结果和阶段报告信息。','download')}<div class="softbox"><h3>本次导出</h3><p class="small muted">${s.history.length} 条学习记录<br>${s.reports.length} 份阶段报告<br>不包含上传的原文件</p></div>${notice('导出文件只在本机生成；没有调用任何上传或云端服务。')}`,()=>btn('导出本地演示记录','export'),null,'真实生成可下载 JSON，仅含演示数据。');
register('E09',s=>s.feedbackSent?`${emptyState('反馈已记录','谢谢你帮助发现问题。原型已保存反馈状态，尚未发送到服务端。','check')}${steps([['反馈已提交','本地演示记录'],['等待核查','核实答案、讲解与来源'],['结果通知','确认无效后会修正成绩与统计']],1)}${notice('下方可演示“题目确认无效”后的统计更正。')}${btn('演示：确认该题无效','invalidate','','secondary full')}`:`${title('哪里需要再核实一下？','提交后可以查看处理进度。')}${heading('问题类型')}${pills([['answer','答案有误'],['explanation','讲解有误'],['source','来源不相关']],s.feedbackType,'feedbackType')}${textfield('补充说明','feedback',s.feedback,'请说明有疑问的选项、讲解或来源。')}${citation(D.questions[s.qids[s.qi]]||D.questions[2],s)}${error(s)}`,s=>s.feedbackSent?go('查看更正后的报告','C01','secondary'):btn('提交反馈','feedback'),null,'反馈状态可看；确认无效时重新计算分母并保留说明。');

register('F01',s=>`${segments([['new','首次学习'],['data','数据不足']],s.emptyKind,'set','emptyKind')}${emptyState(s.emptyKind==='new'?'第一份收获，从好奇开始':'再积累一点，再看趋势',s.emptyKind==='new'?'输入一个主题，或添加你的资料。完成一局后，这里就会留下第一条记录。':'目前的学习数据还不足以形成可靠趋势。你仍然可以查看每次作答与知识讲解。',s.emptyKind==='new'?'spark':'chart')}${s.emptyKind==='data'?notice('不显示没有依据的增长、排名或掌握度结论。'):''}`,()=>go('开始第一次学习','A01'),null,'新用户无伪造统计；小样本不输出趋势结论。');
register('F02',s=>`${title('输入需要稍作调整','你的内容会保留，修改后可以继续。')}${segments([['empty','内容为空'],['long','超过上限'],['limit','资料超限']],s.problem,'set','problem')}${textfield('学习内容','input',s.input,'文字上限 20,000 字；入口会说明文件大小与时长限制。')}${notice({empty:'请输入主题或粘贴资料，再开始整理。',long:'资料超过 20,000 字，请分成多个学习任务。不会静默截断。',limit:'纯网页最多 10 个链接，混合任务最多 5 份来源。请移除多余资料。'}[s.problem],'error')}${btn('填入可体验的示例主题','example','','secondary full')}`,()=>go('返回学习输入','A01'),null,'空、超长与超限均保留输入，不静默截断。');
register('F03',s=>`${title('有一份资料，需要处理','其他已成功读取的内容仍然保留。')}${segments([['video','视频'],['document','文档'],['web','网页']],s.sourceProblem,'set','sourceProblem')}${sourceRow({...D.sources[0]},false)}${notice({video:'视频没有可用字幕或有效音轨，暂时无法生成可靠的转写。',document:'文档可能加密、损坏或 OCR 置信度不足，无法确认可用正文。',web:'网页无法公开访问，可能需要登录或已经失效。'}[s.sourceProblem],'error')}<div class="button-row">${btn('重试这份来源','retry-failed','','secondary')}${go('替换资料','A06','')}</div>${notice('只有成功读取并确认的来源才会用于出题。')}`,()=>btn('移除失败项，继续确认','skip-failed'),null,'三类来源失败可切换；重试不删除其他成功来源。');
register('F04',s=>`${title('先确认知识，再生成问题','内容不足或存在冲突时，先帮你找到原因。')}${segments([['empty','无可靠来源'],['short','资料不足'],['conflict','来源冲突']],s.problem==='long'||s.problem==='limit'?'empty':s.problem,'set','problem')}${emptyState(s.problem==='conflict'?'两份资料的说法不一致':s.problem==='short'?'现有资料还不足以出题':'没有取得可靠的知识来源',s.problem==='conflict'?'请查看原文并调整采用范围。争议内容不会直接生成唯一答案题。':'补充正文、调整学习主题，或换一份可读取的资料。','book','warning')}${s.problem==='conflict'?`<div class="citation">来源 A：评估使用独立测试集。<small>示例冲突片段 A</small></div><div class="citation">来源 B：只看训练准确率即可。<small>示例冲突片段 B，需核实</small></div>`:''}`,()=>go('调整资料与来源','A11'),null,'不使用模型记忆伪装检索结果；冲突内容先确认。');
register('F05',s=>`${segments([['timeout','生成超时'],['quality','质量未通过']],s.failureKind,'set','failureKind')}${emptyState(s.failureKind==='quality'?'这组问题，还不够可靠':'这次生成花了更长时间',s.failureKind==='quality'?'部分问题的答案与依据未能通过检查。我们保留了知识集合，你可以重试或补充资料。':'已经解析的资料和确认过的知识都在，不需要重新上传。','refresh','warning')}<div class="softbox"><h3>机器学习入门</h3><p class="small muted">知识摘要已保留 · 采用来源已保留</p>${chip('可单独重试','blue')}</div>${go('修改资料','A06','secondary full')}`,()=>go('重新生成题组','B02'),null,'题组失败保留上游资料；不让结构异常问题进入作答。');

case 'create-report':if(!s.from||!s.to||s.from>s.to)return fail('请选择有效的开始和结束日期，开始日期不能晚于结束日期。');{const r={id:'report-'+Date.now(),name:{week:'本周学习报告',month:'本月学习报告',custom:'自定义阶段报告'}[s.reportPeriod],range:`${s.from} — ${s.to}`,generated:'2026-09-28',from:s.from,to:s.to,topic:s.reportTopic,period:s.reportPeriod};s.reports.unshift(r);s.selectedReport=r.id;s.readyReport=true;navigate(s,'D11');}break;
case 'open-report':{const r=s.reports.find(x=>x.id===val);if(!r)break;s.selectedReport=r.id;s.from=r.from;s.to=r.to;s.reportTopic=r.topic;s.reportPeriod=r.period||'week';navigate(s,'D11');break;}
case 'login':if(!s.agreed)return fail('请先阅读并同意用户协议与隐私说明。');s.logged=true;navigate(s,'E03');break;
case 'merge':if(s.merge&&!s.merged){s.merged=true;if(s.quizStarted&&score(s).submitted)archiveAttempt(s);}s.logged=true;{const target=s.pendingRoute||'D01';s.pendingRoute=null;navigate(s,target);}break;
case 'restore-login':s.logged=true;s.syncDone=true;stay();toast('演示登录已恢复，当前作答继续保留。');break;
case 'delete-start':s.deleteType=val;s.deleteConfirm=false;navigate(s,'E07');break;
case 'delete-confirm':if(!s.deleteConfirm)return fail('请先确认已了解删除影响。');if(s.deleteType==='account'){s.history=[];s.reports=[];s.sources=[];s.answers=[];s.quizStarted=false;s.completed=false;s.logged=false;s.merged=false;}else if(s.deleteType==='report'){const id=s.selectedReport||s.reports[0]?.id;s.reports=s.reports.filter(r=>r.id!==id);}else{const id=s.selectedRecord||s.history[0]?.id;s.history=s.history.filter(r=>r.id!==id);if(s.deleteType==='source'){s.sources=[];s.answers=[];s.quizStarted=false;s.completed=false;}}s.shareActive=false;navigate(s,'E06');toast('指定的演示数据已删除，统计与分享状态已同步更新。');break;
case 'export':{const blob=new Blob([JSON.stringify({kind:'原型演示数据',records:s.history,reports:s.reports},null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='AI闯关学习-演示记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);s.exportDone=true;stay();toast('导出文件已生成。');break;}
case 'feedback':if(!s.feedback.trim())return fail('请补充具体问题，方便核查。');s.feedbackSent=true;stay();break;
case 'invalidate':if(!s.invalid.includes(s.qi))s.invalid.push(s.qi);if(s.quizStarted)archiveAttempt(s);stay();toast('该题已标为无效，相关成绩和统计已更正。');break;
case 'retry-failed':s.sources=s.sources.map(x=>x.status==='failed'?{...x,status:'accepted',detail:'示例恢复成功 · 可查看依据'}:x);navigate(s,'A11');toast('失败来源已切换到恢复成功状态。');break;
case 'skip-failed':s.sources=s.sources.filter(x=>x.status==='accepted');navigate(s,'A10');break;
case 'clear-session':{const keep={history:s.history,reports:s.reports,logged:s.logged};Object.assign(s,fresh(),keep,{_key:s._key});navigate(s,'A01');toast('已清除当前演示会话，保留其他学习记录。');break;}
case 'retry-report':s.reportRetry=true;navigate(s,s.completed?'C01':'C06');toast('示例知识总结已恢复，成绩没有改变。');break;
}
save(s);
});
